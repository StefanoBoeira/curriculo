<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo Vitae - Stéfano Voss Boeira</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title-section h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .title-section p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 0.375rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0.5rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .pdf-container {
            flex: 1;
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            display: flex;
        }

        iframe, object {
            width: 100%;
            height: 100%;
            border: none;
        }

        .fallback-message {
            padding: 2rem;
            text-align: center;
            color: #4b5563;
        }

        .fallback-message a {
            color: #2563eb;
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 0.5rem;
            font-size: 0.8rem;
            color: #64748b;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        @media (max-width: 640px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .actions {
                width: 100%;
            }
            .btn {
                flex: 1;
                justify-content: center;
            }
            .pdf-container {
                /* Substituído min-height por height para resolver o colapso do iframe */
                height: 80vh; 
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="title-section">
                <h1>Stéfano Voss Boeira</h1>
                <p>Curriculum Vitae</p>
            </div>
            <div class="actions">
                <a href="curriculo.pdf#zoom=125" target="_blank" class="btn btn-secondary">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M14 0a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12zM5.93 4.28a1 1 0 0 0-1.86 0l-2.5 6a1 1 0 0 0 1.86.78L4.01 9.5h3.98l.58 1.56a1 1 0 0 0 1.86-.78l-2.5-6zM6 8.5l1-2.67 1 2.67H6z"/>
                    </svg>
                    Abrir em Nova Aba
                </a>
                <a href="curriculo.pdf" download="Curriculo_Stefano_Boeira.pdf" class="btn btn-primary">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                        <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                    </svg>
                    Baixar PDF
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="pdf-container">
            <object data="curriculo.pdf#view=FitH" type="application/pdf">
                <iframe src="curriculo.pdf#view=FitH">
                    <div class="fallback-message">
                        <p>O seu navegador não suporta a visualização direta de PDFs.</p>
                        <p>Você pode <a href="curriculo.pdf" download>clicar aqui para baixar o PDF</a> diretamente.</p>
                    </div>
                </iframe>
            </object>
        </div>
    </main>

    <footer>
        <p>&copy; Currículo Vitae - Hospedado via GitHub Pages</p>
    </footer>

</body>
</html>
